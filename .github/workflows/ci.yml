name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tongzhang
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: tongzhang_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tongzhang -d tongzhang_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgresql://tongzhang:test_only@127.0.0.1:5432/tongzhang_test
      DATABASE_URL: postgresql://tongzhang:test_only@127.0.0.1:5432/tongzhang_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build:api
      - run: pnpm mobile:export
