name: Checks
on:
  # Branch pushes are covered by their pull request; main still checks every merge.
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  # A newer push to the same pull request supersedes its older run. Other events get a
  # per-run group, so main and release checks are never queued behind or dropped.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tongzhang
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: tongzhang_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tongzhang -d tongzhang_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
      NODE_ENV: test
      AUTH_JWT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      TEST_DATABASE_URL: postgresql://tongzhang:test_only@127.0.0.1:5432/tongzhang_test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: tongzhang
      PGPASSWORD: test_only
      PGDATABASE: tongzhang_test
      APP_VARIANT: production
      EXPO_PUBLIC_API_BASE_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:env --tools-only --skip-docker
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:mobile
      - run: pnpm migrate:db
      - run: pnpm test:integration
      - run: pnpm build:server
      - run: pnpm check:mobile-deps
      - run: pnpm doctor:mobile
      - run: pnpm export:mobile
        env:
          NODE_ENV: production
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file apps/server/.env.example -f infra/compose.dev.yml config --quiet
      - run: docker build --build-arg NODE_VERSION="$(cat .node-version)" -f infra/server.Dockerfile -t tongzhang-server:check .
      - run: bash scripts/test-container.sh
