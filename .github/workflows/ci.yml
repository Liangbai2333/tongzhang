name: Checks
on:
  # Branch pushes are covered by their pull request; main still checks every merge.
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  # A newer push to the same pull request supersedes its older run. Other events get a
  # per-run group, so main and release checks are never queued behind or dropped.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: 'true'
  NODE_ENV: test
  AUTH_JWT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  APP_VARIANT: production
  EXPO_PUBLIC_API_BASE_URL: https://api.example.com
jobs:
  # Pull requests skip the jobs their changed paths cannot affect. Pushes to main and
  # release calls (workflow_call) always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.scope.outputs.mobile }}
      server: ${{ steps.scope.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "server=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          printf 'Changed files:\n%s\n' "$files"
          shared='^(packages/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.node-version$|\.github/)'
          mobile=false
          server=false
          if echo "$files" | grep -Eq "$shared|^apps/mobile/"; then mobile=true; fi
          if echo "$files" | grep -Eq "$shared|^apps/server/|^infra/|^scripts/"; then server=true; fi
          echo "mobile=$mobile server=$server"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"

  # Always runs: type check, lint, Prettier (docs included) and database-free tests.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check:env --tools-only --skip-docker
      - run: pnpm check
      - run: pnpm test

  mobile-tests:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:mobile

  # JS bundle export only (no APK/IPA); one platform per runner halves the wall time.
  mobile-export:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - if: matrix.platform == 'android'
        run: |
          pnpm check:mobile-deps
          pnpm doctor:mobile
      - run: pnpm build:shared && pnpm --filter @tongzhang/mobile exec expo export --platform ${{ matrix.platform }}
        env:
          NODE_ENV: production

  integration:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tongzhang
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: tongzhang_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tongzhang -d tongzhang_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tongzhang:test_only@127.0.0.1:5432/tongzhang_test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: tongzhang
      PGPASSWORD: test_only
      PGDATABASE: tongzhang_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm migrate:db
      - run: pnpm test:integration
      - run: pnpm build:server

  container:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file apps/server/.env.example -f infra/compose.dev.yml config --quiet
      - run: docker build --build-arg NODE_VERSION="$(cat .node-version)" -f infra/server.Dockerfile -t tongzhang-server:check .
      - run: bash scripts/test-container.sh
