name: tongzhang

x-server: &server
  image: ${SERVER_IMAGE:?Set an immutable server image tag or digest}
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3300
    PGHOST: postgres
    PGPORT: 5432
    PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
    AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random 64-character lowercase hex signing secret}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    TRUST_PROXY: ${PROXY_SUBNET:-172.30.0.0/28}
  networks: [backend, proxy]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    <<: *server
    profiles: [tools]
    command: ['node', 'scripts/migrate.ts']
    depends_on:
      postgres:
        condition: service_healthy
  server:
    <<: *server
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3300/health/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [proxy]
    depends_on:
      server:
        condition: service_healthy

networks:
  backend:
    internal: true
  # Only the API and Caddy share this trusted proxy network.
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.0.0/28}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
