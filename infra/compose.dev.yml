name: tongzhang-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tongzhang
      POSTGRES_PASSWORD: tongzhang_local_only
      POSTGRES_DB: tongzhang
    ports:
      - '127.0.0.1:35432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tongzhang -d tongzhang']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
