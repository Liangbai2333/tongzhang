name: tongzhang-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PGUSER:?Run pnpm setup:env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in apps/server/.env}
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in apps/server/.env}
    ports:
      - '127.0.0.1:${PGPORT:?Set PGPORT in apps/server/.env}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
